<div class="row h-100 align-items-center">
    <div class="col-3">
        <div class="bg-dark p-4 rounded">
            <p>
                Een kunsthistoricus moet goed kunnen kijken. Schrijf op wat je
                ziet en raad de juiste termen.
            </p>

            <p class="mb-0">
                Vergelijk de afbeelding met andere
                werken in de <b>galerij</b>. Welke
                elementen komen overeen?
            </p>
        </div>
    </div>
    <div class="col-6 text-center">
        @let target = question().target_work;
        <img [src]="target.image_url"
            style="max-height: 400px; max-width: 100%; cursor: pointer;"
            class="border border-dark border-3"
            (click)="focus.emit(target)" />
    </div>
    <div class="col-3">
        <hl-keyword-input [question]="question()"
            (completed)="onCompleted()" />
    </div>
</div>
