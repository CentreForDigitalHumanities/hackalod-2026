<div class="row mt-4 align-items-center h-100">
    <div class="col-3">
        <div class="bg-dark rounded p-4">
            Vergelijk je observaties met andere schilderijen.
            Welke hoort er niet bij?
        </div>
    </div>
    <div class="col-9">
        @for (row of rows; track row) {
            <div class="row h-100">
                @for (col of cols; track col) {
                    @let index = (rows.length * row) + col;
                    <div class="col p-2">
                        <img src="/uu-cdh.svg"
                            class="w-100 h-100 object-fit-contain"
                            style="cursor: pointer;"
                            (click)="onSelect(index)">
                    </div>
                }
            </div>
        }
    </div>
</div>
