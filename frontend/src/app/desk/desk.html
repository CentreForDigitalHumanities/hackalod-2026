@let question = question$ | async;
<div class="bg-desk h-100 d-flex flex-column p-4"
    [class.bg-desk-closeup]="focus()">
    @if (!focus()) {
        <div class="d-flex flew-row justify-content-between">
            <a class="btn btn-dark" [routerLink]="['/galerij']">
                <fa-icon [icon]="faArrowLeft" />
                Galerij
            </a>
            <a class="btn btn-dark" [routerLink]="['/bibliotheek']">
                Bibliotheek
                <fa-icon [icon]="faArrowRight" />
            </a>
        </div>

        <div class="flex-grow-1">
            @if (question) {
                @switch (stage$ | async) {
                    @case (1) {
                        <hl-describe-game [question]="question"
                            (focus)="focus.set($event)" />
                    }
                    @case (2) {
                        <hl-one-out-game />
                    }

                }
            }
        </div>

        <div class="text-center">
            <a [routerLink]="['/home']" class="btn btn-dark">
                <fa-icon [icon]="faArrowDown" />
                Terug
            </a>
        </div>
    } @else {
        @if (question) {
            <div class="flex-grow-1 p-4">
                <div class="w-100" style="height: 65vh">
                    <img [src]="question.target_work.image_url"
                        class="object-fit-contain w-100 h-100"
                        />
                </div>
            </div>
            <div class="pt-4 text-center">
                <button class="btn btn-dark" (click)="focus.set(null)">
                    <fa-icon [icon]="faArrowDown" />
                    Terug
                </button>
            </div>
        }
    }
</div>
