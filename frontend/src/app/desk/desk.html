<div class="p-5 bg-desk h-100 d-flex flex-column">
    <div class="d-flex flew-row justify-content-between">
        <a class="btn btn-dark" [routerLink]="['/galerij']">
            <fa-icon [icon]="faArrowLeft" />
            Galerij
        </a>
        <a class="btn btn-dark" [routerLink]="['/bibliotheek']">
            Bibliotheek
            <fa-icon [icon]="faArrowRight" />
        </a>
    </div>
    @let question = question$ | async;
    @if (question) {
        <div class="flex-grow-1">
            <div class="row h-100 align-items-center">
                <div class="col-3">
                    <div class="bg-dark p-4 rounded">
                        <h1 class="h4">Wat zie je?</h1>
                        <p>
                            Beschrijf wat je ziet in de afbeelding.
                        </p>

                        <p class="mb-0">
                            Vergelijk de afbeelding met andere
                            werken in de <b>galerij</b>. Welke
                            elementen komen overeen?
                        </p>
                    </div>
                </div>
                <div class="col-6 text-center">
                    <img [src]="question.target_work.image_url"
                        style="max-height: 400px;"
                        class="border border-dark border-3" />
                </div>
                <div class="col-3">
                    <hl-keyword-input [question]="question"
                        (completed)="onCompleted()" />
                </div>
            </div>
        </div>
    }
    <div class="text-center">
        <a [routerLink]="['/home']" class="btn btn-dark">
            <fa-icon [icon]="faArrowDown" />
            Terug
        </a>
    </div>
</div>
