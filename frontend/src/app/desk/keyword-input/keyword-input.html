@let showSuccess = showSuccess$ | async;
<div class="p-4 rounded bg-dark">
    <label class="form-label fw-bold" for="input-keyword">Kernwoorden...</label>

    <p>
        @let guessed = keywordsGuessed$ | async;
        @for (keyword of guessed; track keyword) {
            <span class="badge bg-success">
                {{keyword}}
            </span>
        }
    </p>

    <input class="form-control" id="input-keyword"
        (input)="onInputChange($event.target.value, $event.target)"
        [class.is-valid]="showSuccess" />
</div>
