@let question = question$ | async;


<div class="d-flex flex-column" style="height: 100%;">
    @if (question) {
        <div class="p-4 flex-grow-1">
            <div class="row">
                @for (work of question.works; track $index) {
                    <div class="col-4 p-3">
                        <hl-artwork [work]="work" />
                    </div>
                }
            </div>
        </div>
        <div class="p-4 text-end">
            <a class="btn btn-dark" [routerLink]="['/home']">
                Terug
            </a>
        </div>
        <div>
            <hl-keyword-input [tag]="question.tag"
                (result)="onSucces()" />
        </div>
    }
</div>
