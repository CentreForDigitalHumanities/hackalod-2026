@let question = question$ | async;

@if (question) {
    <div class="d-flex flex-column" style="height: 100%;">
        <div class="p-5 flex-grow-1">
            <div class="row">
                @for (work of question.works; track work.url) {
                    <div class="col-4 p-3">
                        <hl-artwork [work]="work" />
                    </div>
                }
            </div>
        </div>
        <div class="p-4">
            <hl-keyword-input [tag]="question.tag" />
        </div>
    </div>
}
